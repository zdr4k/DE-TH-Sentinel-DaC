id: d3c1a7f2-6b4e-4c8a-9e51-2f7a0b8c4d16
name: role_assignment_created
displayName: 'Role Assignment Created'
description: 'Detects successful role assignment writes in the Azure Activity Log. This rule is triggered when a role assignment is created, indicating that a user or service principal has been granted a new role in the Azure environment.'
version: 1.0.0
status: experimental
severity: medium
kind: Scheduled
author: 'Kelvin Santos'
attack:
  matrix: enterprise-attack
  tactics: [Persistence, PrivilegeEscalation]
  techniques: [T1078, T1134]
dataSources:
  - table: AzureActivity
    connector: AzureActivity
queryFrequency: PT15M
queryPeriod: PT1H
triggerOperator: GreaterThan
triggerThreshold: 0
suppresion:
  enabled: false
  duration: PT1H
query: |
  AzureActivity
  | where TimeGenerated > ago(1h)
  | where OperationNameValue =~ "MICROSOFT.AUTHORIZATION/ROLEASSIGNMENTS/WRITE"
  | where ActivityStatusValue =~ "Success"
  | project TimeGenerated, Caller, CallerIpAddress, ResourceGroup, SubscriptionId, _ResourceId
incident:
  create: true
  grouping:
    enabled: true
    matchBy: [Account]
eventGroup: AlertPerResult

entityMappings:
  - entity: Account
    fields:
      FullName: Caller
  - entity: IP
    fields:
      Address: CallerIpAddress

customDetails:
  ResourceGroup: ResourceGroup

ads: docs/ads/role_assignment_created.md
tests: tests/role_assignment_created/
references: []