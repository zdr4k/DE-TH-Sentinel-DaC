id: 31ae3148-3ec0-40d3-8343-0a9a6cda9394
display_name: "Azure diagnostic setting deleted"
description: "Identifies successful deletions of diagnostic settings in the Azure Activity log. Removing a diagnostic setting stops logs from reaching the workspace, which an attacker can use to hide activity."
severity: "High"
enabled: true
query: |
  AzureActivity
  | where TimeGenerated > ago(1h)
  | where OperationNameValue =~ "MICROSOFT.INSIGHTS/DIAGNOSTICSETTINGS/DELETE"
  | where ActivityStatusValue =~ "Success"
  | project TimeGenerated, Caller, ResourceGroup, SubscriptionId, _ResourceId
query_frequency: "PT15M"
query_period: "PT1H"
trigger_operator: "GreaterThan"
trigger_threshold: 0
suppression_enabled: false
suppression_duration: "PT1H"
mitre_mapping:
  - tactic: "DefenseEvasion"
    techniques:
      - "T1562"
entity_mappings:
  - entity_type: "Account"
    field_mappings:
      - identifier: "FullName"
        column_name: "Caller"
  - entity_type: "IP"
    field_mappings:
      - identifier: "Address"
        column_name: "CallerIpAddress"
incident_configuration:
  create_incident: true
  grouping_enabled: false
custom_details: {}
event_grouping:
  aggregation_method: "AlertPerResult"
meta:
  owner: "Kelvin Santos"
  references: []
version: "1.0.0"
kind: "Scheduled"