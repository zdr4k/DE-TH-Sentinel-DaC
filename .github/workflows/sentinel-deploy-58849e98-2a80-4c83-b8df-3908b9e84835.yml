name: Deploy Content to log-analyst-de-lab [58849e98-2a80-4c83-b8df-3908b9e84835]

on:
  push:
    branches: [ main ]
    paths:
    - 'Detections/**'
    - '!.github/workflows/**'
    - '.github/workflows/sentinel-deploy-a63f132e-c4ec-4a4a-a84e-fc46a6f44880.yml'

jobs:
  deploy-content:
    runs-on: windows-latest

    env:
      resourceGroupName: 'rg-de-lab'
      workspaceName: 'log-analyst-de-lab'
      workspaceId: 'c483c246-5118-402e-851f-0f1a66dbf700'
      directory: '${{ github.workspace }}/Detections'
      cloudEnv: 'AzureCloud'
      contentTypes: 'AnalyticsRule,AutomationRule,HuntingQuery,Parser,Playbook,Workbook,Watchlist'
      branch: 'main'
      sourceControlId: '58849e98-2a80-4c83-b8df-3908b9e84835'
      rootDirectory: '${{ github.workspace }}'
      githubAuthToken: ${{ secrets.GITHUB_TOKEN }}
      smartDeployment: 'true'

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Login to Azure (Attempt 1)
        continue-on-error: true
        id: login1
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_58849e982a804c83b8df3908b9e84835 }}
          tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_58849e982a804c83b8df3908b9e84835 }}
          subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_58849e982a804c83b8df3908b9e84835 }}
          environment: 'AzureCloud'
          audience: api://AzureADTokenExchange
          enable-AzPSSession: true

      - name: Wait 30 seconds if login attempt 1 failed
        if: ${{ steps.login1.outcome == 'failure' }}
        shell: pwsh
        run: Start-Sleep -Seconds 30

      - name: Login to Azure (Attempt 2)
        continue-on-error: true
        id: login2
        if: ${{ steps.login1.outcome == 'failure' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_58849e982a804c83b8df3908b9e84835 }}
          tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_58849e982a804c83b8df3908b9e84835 }}
          subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_58849e982a804c83b8df3908b9e84835 }}
          environment: 'AzureCloud'
          audience: api://AzureADTokenExchange
          enable-AzPSSession: true

      - name: Wait 30 seconds if login attempt 2 failed
        if: ${{ steps.login2.outcome == 'failure' }}
        shell: pwsh
        run: Start-Sleep -Seconds 30

      - name: Login to Azure (Attempt 3)
        id: login3
        if: ${{ steps.login2.outcome == 'failure' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_58849e982a804c83b8df3908b9e84835 }}
          tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_58849e982a804c83b8df3908b9e84835 }}
          subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_58849e982a804c83b8df3908b9e84835 }}
          environment: 'AzureCloud'
          audience: api://AzureADTokenExchange
          enable-AzPSSession: true

      - name: Update Bicep CLI
        shell: pwsh
        run: |
          az bicep upgrade
          az bicep version

      - name: Deploy Content to Microsoft Sentinel
        uses: azure/powershell@v2
        with:
          azPSVersion: 'latest'
          inlineScript: |
            & "${{ github.workspace }}\.github\workflows\azure-sentinel-deploy-58849e98-2a80-4c83-b8df-3908b9e84835.ps1"