name: ADS check

on:
  pull_request:

permissions:
  contents: read

jobs:
  ads:
    name: ADS check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Check ADS documents
        run: python Tools/check_ads_present.py "origin/${{ github.base_ref }}"